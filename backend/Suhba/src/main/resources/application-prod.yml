server:
  # Render terminates TLS at its edge and forwards plain HTTP to the container.
  # Honour X-Forwarded-* so the app knows the request is https — required for
  # Secure cookies and correct absolute URLs behind the proxy.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Frontend (Cloudflare Pages) and backend (Render) are different sites,
        # so the session cookie must be SameSite=None + Secure to survive the
        # cross-site admin login request.
        same-site: none
        secure: true

admin:
  allowed-origin: ${ADMIN_ALLOWED_ORIGIN}
  cookie:
    # Same cross-site requirement applies to the CSRF (XSRF-TOKEN) cookie, otherwise
    # admin mutations (approve/reject/edit/delete) fail with 403 in production.
    same-site: None
    secure: true
